[package]
name = "qingjian-release-sign"
description = "发版用：给 releases.json 生成 ed25519 分离签名，客户端（qingjian-update）按内置公钥验"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
getrandom = "0.4"
qingjian-update.workspace = true
thiserror.workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[package]
name = "qingjian-clipboard-sync"
description = "青简剪贴板的设备间同步：配对、加密通道、合并与局域网发现，不依赖具体存储和传输"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
relay-server = []

[dependencies]
if-addrs = "0.15"
mdns-sd = "0.21.7"
qingjian-learning.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
snow = "0.10"
socket2 = "0.6.5"
spake2 = "0.4"
tempfile = "3.27.0"
thiserror.workspace = true
tracing.workspace = true
tungstenite.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_DataExchange"] }
